[project]
name = "train-go"
version = "0.1.0"
description = "SRT + Korail 기차 자동 예매 서버"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.34.0",
    "SRTrain>=2.6.7",
    "korail2>=0.4.0",
    "cryptography>=44.0.0",
    "apscheduler>=3.10.0",
    "httpx>=0.28.0",
    "pydantic>=2.10.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
train-go = "src.main:main"
